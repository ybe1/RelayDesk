[project]
name = "mewhelp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.4.1",
    "langchain-openai>=1.6.2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.44,<3",
    "pymysql>=1.1.2,<2",
    "pymilvus==3.0.1",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
