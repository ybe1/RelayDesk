<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>后台管理 · 喵喵优选</title><link rel="stylesheet" href="/static/admin.css"></head>
<body><header class="site-header"><a class="brand" href="/"><span class="brand-mark">🐱</span><span><b>喵喵优选</b><small>智能客服工作台</small></span></a><nav id="app-nav" class="site-nav" aria-label="主导航"></nav></header>
<main class="page"><div class="page-title"><div><h1>后台管理</h1><p class="muted">聚合查看知识库依赖与维护作业状态。</p></div><button id="admin-refresh" class="secondary">刷新数据</button></div><div id="admin-notice" class="notice" role="status"></div>
<section class="grid metrics"><article class="card metric"><div class="label">知识总数</div><div class="value" id="a-total">读取中</div></article><article class="card metric"><div class="label">待向量化</div><div class="value" id="a-pending">读取中</div></article><article class="card metric"><div class="label">已完成</div><div class="value" id="a-done">读取中</div></article><article class="card metric"><div class="label">Milvus 向量数</div><div class="value" id="a-milvus">读取中</div></article><article class="card metric"><div class="label">一致性</div><div class="value" id="a-consistent">读取中</div></article><article class="card metric"><div class="label">依赖状态</div><div class="value" id="a-deps">读取中</div></article></section>
<section class="section"><div class="section-heading"><span class="section-no">检索配置</span><h2>当前只读配置</h2></div><div class="grid three-col"><article class="card metric"><div class="label">RAG Top-K</div><div class="value" id="a-top-k">读取中</div></article><article class="card metric"><div class="label">最低分数</div><div class="value" id="a-min-score">读取中</div></article><article class="card"><h3>嵌入与向量地址</h3><p class="muted" id="a-endpoint">读取中</p></article></div></section>
<section class="section"><div class="section-heading"><span class="section-no">维护作业</span><h2>最近状态与日志尾</h2></div><article class="card"><div id="admin-jobs"><p class="empty">读取中…</p></div></article></section>
<section class="section"><div class="section-heading"><span class="section-no">入口</span><h2>知识库操作</h2></div><article class="card"><p class="muted">材料录入、检索自测、暂存查看和重置确认都在知识库页面完成。</p><div class="actions"><a href="/kb"><button>打开知识库</button></a></div></article></section></main>
<script src="/static/admin.js"></script><script src="/static/admin-page.js"></script></body></html>
