<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>喵喵优选 · 智能客服</title>
<style>
  :root {
    --accent: #f97316;
    --accent-soft: #fff1e6;
    --bg: #f6f7f9;
    --bubble-user: #f97316;
    --bubble-user-text: #fff;
    --bubble-assistant: #fff;
    --text: #1f2937;
    --text-dim: #6b7280;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: #fff;
    border-bottom: 1px solid var(--border);
  }
  header .logo {
    width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, #fb923c, #f97316);
    color: #fff; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
  }
  header .title { font-size: 16px; font-weight: 600; }
  header .subtitle { font-size: 12px; color: var(--text-dim); }
  header .status {
    margin-left: auto; font-size: 12px; color: #16a34a;
    display: flex; align-items: center; gap: 6px;
  }
  header .status::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: #16a34a; display: inline-block;
  }
  header .nav { margin-left: auto; display: flex; gap: 6px; }
  header .nav a { color: var(--text-dim); text-decoration: none; font-size: 13px; padding: 7px 10px; border-radius: 8px; }
  header .nav a:hover { color: #9a3412; background: var(--accent-soft); }
  header .nav a[aria-current="page"] { color: #9a3412; background: var(--accent-soft); font-weight: 600; }

  #messages {
    flex: 1; overflow-y: auto;
    padding: 20px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .msg { display: flex; gap: 10px; max-width: 78%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.assistant { align-self: flex-start; }
  .avatar {
    width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .msg.assistant .avatar { background: var(--accent-soft); }
  .msg.user .avatar { background: #e5e7eb; }
  .bubble {
    padding: 10px 14px; border-radius: 14px;
    font-size: 15px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble {
    background: var(--bubble-user); color: var(--bubble-user-text);
    border-top-right-radius: 4px;
  }
  .msg.assistant .bubble {
    background: var(--bubble-assistant); color: var(--text);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }
  .tool-trace {
    display: none; width: fit-content; margin-bottom: 7px;
    padding: 2px 8px; border-radius: 999px;
    background: var(--accent-soft); color: #9a3412;
    font-size: 12px; line-height: 1.5; white-space: normal;
  }
  .tool-trace.visible { display: block; }
  .tool-trace.running::before { content: '⏳ '; }
  .tool-trace.success::before { content: '✓ '; }
  .tool-trace.failed::before { content: '⚠ '; }
  .citation { display: inline; margin: 0 2px; padding: 0 4px; border: 0; border-radius: 5px; background: var(--accent-soft); color: #9a3412; font: inherit; font-weight: 700; cursor: pointer; }
  .citation:focus-visible, .feedback button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .feedback { display: flex; align-items: center; gap: 5px; margin-top: 8px; color: var(--text-dim); font-size: 12px; }
  .feedback button { padding: 3px 7px; border: 1px solid var(--border); border-radius: 7px; background: #fff; cursor: pointer; }
  .feedback button.selected { color: #9a3412; border-color: var(--accent); background: var(--accent-soft); }
  .feedback button:disabled:not(.selected) { opacity: .45; }
  .chat-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chat-actions button, .ticket-confirm { border: 1px solid var(--accent); color: #9a3412; background: var(--accent-soft); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  .chat-actions button:disabled { opacity: .6; cursor: default; }
  .order-cards { display: grid; gap: 8px; margin-top: 12px; }
  .order-card { text-align: left; border: 1px solid var(--border); border-radius: 10px; background: #fff; padding: 12px; cursor: pointer; color: var(--text); }
  .order-card:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .order-card strong, .order-card small { display: block; }
  .order-card small { margin-top: 5px; color: var(--text-dim); }
  .order-card:disabled { opacity: .55; cursor: default; }
  .action-note { display: block; width: 100%; font-size: 12px; color: var(--text-dim); }
  .ticket-dialog { border: 1px solid var(--border); border-radius: 14px; padding: 22px; width: min(420px, 90vw); }
  .ticket-dialog::backdrop { background: #0005; }
  .ticket-dialog label { display: block; margin: 12px 0; }
  .ticket-dialog textarea, .ticket-dialog select { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 7px; }
  #citation-dialog { width: min(620px, calc(100% - 32px)); max-height: 85vh; margin: auto; padding: 22px; border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 20px 60px #11182740; color: var(--text); }
  #citation-dialog::backdrop { background: #11182780; }
  .dialog-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .dialog-head h2 { font-size: 19px; }
  .dialog-close { border: 0; background: var(--accent-soft); color: #9a3412; border-radius: 7px; padding: 5px 10px; cursor: pointer; }
  .source-label { color: var(--text-dim); font-size: 12px; margin: 8px 0 15px; overflow-wrap: anywhere; }
  .source-section { margin: 14px 0; }
  .source-section h3 { font-size: 13px; margin-bottom: 5px; }
  .source-section p { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; }
  .source-state { color: var(--text-dim); font-size: 13px; }
  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-dim);
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .2; } 30% { opacity: 1; } }

  footer {
    display: flex; gap: 10px;
    padding: 14px 20px;
    background: #fff; border-top: 1px solid var(--border);
  }
  #input {
    flex: 1; resize: none;
    padding: 11px 14px; border-radius: 12px;
    border: 1px solid var(--border);
    font-size: 15px; font-family: inherit; line-height: 1.5;
    outline: none; max-height: 120px;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    padding: 0 22px; border: none; border-radius: 12px;
    background: var(--accent); color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: opacity .15s;
  }
  #send:disabled { opacity: .5; cursor: not-allowed; }
  .chat-layout { display: flex; flex: 1; min-height: 0; }
  .chat-panel { display: flex; flex: 1; min-width: 0; flex-direction: column; }
  #conversation-sidebar { width: 230px; flex-shrink: 0; padding: 16px 10px; overflow-y: auto; border-right: 1px solid var(--border); background: #fff; }
  #new-conversation { width: 100%; padding: 10px; border: 1px solid var(--accent); border-radius: 9px; color: #9a3412; background: var(--accent-soft); cursor: pointer; margin-bottom: 12px; }
  .conversation-item { display: block; width: 100%; text-align: left; padding: 10px; margin: 4px 0; border: 1px solid transparent; border-radius: 9px; background: none; cursor: pointer; color: var(--text); }
  .conversation-item.active { border-color: var(--accent); background: var(--accent-soft); }
  .conversation-item small { display: block; margin-top: 5px; color: var(--text-dim); }
  .conversation-item:disabled, #new-conversation:disabled { opacity: .5; cursor: default; }
  @media(max-width:700px) { #conversation-sidebar { width: 135px; padding: 10px 5px; } header .subtitle { display: none; } header { flex-wrap: wrap; padding: 10px; } header .nav { margin-left: 0; } .msg { max-width: 95%; } #messages { padding: 12px; } footer { padding: 10px; } }
</style>
</head>
<body>
  <header>
    <div class="logo">🐱</div>
    <div>
      <div class="title">喵喵优选 · 智能客服「小喵」</div>
      <div class="subtitle">商品咨询 · 订单物流 · 售后</div>
    </div>
    <nav class="nav" aria-label="主导航">
      <a href="/" aria-current="page">客服聊天</a>
      <a href="/kb">知识库</a>
      <a href="/admin">后台管理</a>
      <a href="/rag-eval">RAG 评估</a>
    </nav>
    <div class="status">在线</div>
  </header>

  <div class="chat-layout">
  <aside id="conversation-sidebar" aria-label="会话列表">
    <button id="new-conversation" type="button">＋ 新对话</button>
    <div id="conversation-list"></div>
  </aside>
  <section class="chat-panel" aria-label="客服聊天">
  <main id="messages"></main>

  <footer>
    <textarea id="input" rows="1" placeholder="输入你的问题，回车发送…"></textarea>
    <button id="send">发送</button>
  </footer>
  </section>
  </div>
  <dialog id="citation-dialog" aria-labelledby="citation-title">
    <div class="dialog-head"><h2 id="citation-title">引用来源</h2><button id="citation-close" class="dialog-close" type="button" aria-label="关闭引用来源">关闭</button></div>
    <p id="citation-label" class="source-label"></p>
    <p id="citation-state" class="source-state" role="status"></p>
    <div id="citation-detail" hidden>
      <section class="source-section"><h3>章节路径</h3><p id="citation-path"></p></section>
      <section class="source-section"><h3>问题</h3><p id="citation-question"></p></section>
      <section class="source-section"><h3>完整回答</h3><p id="citation-answer"></p></section>
    </div>
  </dialog>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const citationDialog = document.getElementById('citation-dialog');
  const citationState = document.getElementById('citation-state');
  const citationDetail = document.getElementById('citation-detail');
  let citationRequest = 0;

  async function openCitation(citation) {
    const request = ++citationRequest;
    const previousFocus = document.activeElement;
    document.getElementById('citation-label').textContent =
      `[${citation.n}] ${String(citation.section_path || '').slice(0, 140)} · ${String(citation.question || '').slice(0, 120)}`;
    citationDetail.hidden = true;
    citationState.textContent = '正在读取完整来源…';
    citationDialog.showModal();
    document.getElementById('citation-close').focus();
    citationDialog.addEventListener('close', () => { citationRequest++; previousFocus?.focus(); }, { once: true });
    try {
      const response = await fetch(`/api/kb/chunks/${encodeURIComponent(citation.chunk_id)}`);
      if (!response.ok) throw new Error(response.status === 404 ? '来源已不存在（404）。' : `读取失败（${response.status}）。`);
      const detail = await response.json();
      if (request !== citationRequest || !citationDialog.open) return;
      document.getElementById('citation-path').textContent = detail.section_path || '未提供';
      document.getElementById('citation-question').textContent = Array.isArray(detail.questions) ? detail.questions.join('；') : String(detail.questions || '未提供');
      document.getElementById('citation-answer').textContent = detail.answer || '未提供';
      citationState.textContent = '';
      citationDetail.hidden = false;
    } catch (error) {
      if (request === citationRequest && citationDialog.open) citationState.textContent =
        error instanceof TypeError ? '网络连接失败，请稍后重试。' : error.message;
    }
  }
  document.getElementById('citation-close').addEventListener('click', () => citationDialog.close());
  citationDialog.addEventListener('click', event => {
    if (event.target === citationDialog) citationDialog.close();
  });

  function renderAnswer(body, content, citations) {
    const parts = content.split(/(\[\d+\])/g);
    body.replaceChildren(...parts.map(part => {
      const match = /^\[(\d+)\]$/.exec(part);
      if (!match) return document.createTextNode(part);
      const number = Number(match[1]);
      const citation = citations.get(number);
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'citation';
      button.textContent = part;
      button.setAttribute('aria-label', `查看引用 ${number}${citation ? `：${String(citation.section_path || '').slice(0, 100)}` : ''}`);
      button.title = citation ? String(citation.answer_excerpt || citation.question || '').slice(0, 180) : '点击查看引用来源';
      button.addEventListener('click', () => {
        const latest = citations.get(number);
        if (latest) return openCitation(latest);
        citationDetail.hidden = true;
        document.getElementById('citation-label').textContent = `[${number}]`;
        citationState.textContent = '引用来源尚未就绪，请稍后再试。';
        citationDialog.showModal();
      });
      return button;
    }));
  }

  function addFeedback(bubble, feedbackKey = null) {
    const bar = document.createElement('div');
    bar.className = 'feedback';
    bar.setAttribute('aria-label', '评价本次回答');
    const buttons = ['👍', '👎'].map((label, index) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = label;
      button.setAttribute('aria-label', index === 0 ? '回答有帮助' : '回答无帮助');
      button.addEventListener('click', () => {
        if (buttons.some(item => item.disabled)) return;
        button.classList.add('selected');
        buttons.forEach(item => { item.disabled = true; });
        const done = document.createElement('span');
        done.textContent = '已反馈';
        bar.append(done);
        if (feedbackKey) localStorage.setItem('mewhelp_feedback_' + feedbackKey, String(index));
      });
      return button;
    });
    bar.append(...buttons);
    const selected = feedbackKey ? localStorage.getItem('mewhelp_feedback_' + feedbackKey) : null;
    if (selected === '0' || selected === '1') {
      buttons[Number(selected)].classList.add('selected');
      buttons.forEach(button => { button.disabled = true; });
      const done = document.createElement('span'); done.textContent = '已反馈'; bar.append(done);
    }
    bubble.append(bar);
  }

  // 服务端分配数字会话 ID；匿名用户标识由浏览器保存。
  let conversationId = Number(localStorage.getItem('mewhelp_conversation_id')) || null;
  let userId = localStorage.getItem('mewhelp_user_id');
  let isStreaming = false;
  let switchRequestId = 0;
  let sidebarRequestId = 0;
  if (!userId) {
    userId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random());
    localStorage.setItem('mewhelp_user_id', userId);
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addBubble(role, text) {
    const msg = document.createElement('div');
    msg.className = 'msg ' + role;
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'assistant' ? '🐱' : '🙂';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    const trace = document.createElement('div');
    trace.className = 'tool-trace';
    const body = document.createElement('span');
    body.className = 'bubble-body';
    body.textContent = text;
    bubble.appendChild(trace);
    bubble.appendChild(body);
    msg.appendChild(avatar);
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    scrollToBottom();
    return { bubble, body, trace };
  }

  function showTyping(body) {
    const t = document.createElement('span');
    t.className = 'typing';
    for (let i = 0; i < 3; i++) t.appendChild(document.createElement('span'));
    body.appendChild(t);
    scrollToBottom();
    return t;
  }

  function setSending(v) {
    isStreaming = v;
    if (v) switchRequestId++;
    sendBtn.disabled = v;
    inputEl.disabled = v;
    document.getElementById('new-conversation').disabled = v;
    for (const button of document.querySelectorAll('.conversation-item')) button.disabled = v;
    if (!v) inputEl.focus();
  }

  // 解析一个 SSE 帧(形如 "data: {...}" 或 "event: error\ndata: {...}")
  function parseFrame(frame) {
    let eventType = null;
    let payload = '';
    for (const line of frame.split('\n')) {
      if (line.startsWith('event:')) {
        eventType = line.slice(6).trim();
      } else if (line.startsWith('data:')) {
        payload += line.slice(5).trim();
      }
    }
    if (!payload) return { type: 'ignore' };
    if (payload === '[DONE]') return { type: 'done' };
    const data = JSON.parse(payload);
    if (eventType === 'error') return { type: 'error', message: data.message || '出错了' };
    if (eventType === 'conversation') return { type: 'conversation', conversationId: data.conversation_id };
    if (eventType === 'tool_status') return { type: 'tool_status', ...data };
    if (eventType === 'citations') return { type: 'citations', citations: data.citations };
    if (eventType === 'actions') return { type: 'actions', ...data };
    if (eventType === 'workflow_status') return { type: 'workflow_status', ...data };
    if (eventType === 'order_selection') return { type: 'order_selection', ...data };
    if (eventType === 'workflow_summary') return { type: 'workflow_summary', ...data };
    if (data.delta) return { type: 'delta', delta: data.delta };
    return { type: 'ignore' };
  }

  function addActions(bubble, actions, cid) {
    const bar = document.createElement('div');
    bar.className = 'chat-actions';
    for (const offer of actions) {
      if (!['handoff', 'ticket', 'refund'].includes(offer.action)) continue;
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = offer.action === 'handoff' ? '转人工' : offer.action === 'refund' ? '提交退款申请' : '建工单';
      const handoffKey = 'mewhelp_handoff_' + cid + '_' + offer.offer_id;
      if (offer.confirmed || (offer.action === 'handoff' && localStorage.getItem(handoffKey))) {
        button.disabled = true;
        button.textContent = offer.action === 'handoff' ? '已转接人工客服' : offer.action === 'refund' ? '演示申请已提交' : '工单已创建';
      }
      button.addEventListener('click', () => {
        if (button.disabled) return;
        if (offer.action === 'refund') { showRefundForm(button, bar, offer, cid); return; }
        if (offer.action === 'handoff') {
          button.disabled = true;
          button.textContent = '已转接人工客服';
          localStorage.setItem(handoffKey, '1');
          addBubble('assistant', '您好，我是客服小猫，请问有什么可以帮您的');
          return;
        }
        button.disabled = true;
        const dialog = document.createElement('dialog');
        dialog.className = 'ticket-dialog';
        const title = document.createElement('h3'); title.textContent = '确认创建工单';
        const label = document.createElement('label'); label.textContent = '问题描述';
        const description = document.createElement('textarea');
        description.rows = 5; description.maxLength = 4000;
        description.value = offer.defaults?.description || '';
        label.appendChild(description);
        const typeLabel = document.createElement('label'); typeLabel.textContent = '工单类型';
        const select = document.createElement('select');
        for (const value of ['售后', '投诉', '咨询']) {
          const option = document.createElement('option'); option.value = value; option.textContent = value; select.appendChild(option);
        }
        select.value = offer.defaults?.ticket_type || '咨询'; typeLabel.appendChild(select);
        const error = document.createElement('p'); error.setAttribute('role', 'alert');
        const cancel = document.createElement('button'); cancel.type = 'button'; cancel.textContent = '取消';
        const confirm = document.createElement('button'); confirm.type = 'button'; confirm.className = 'ticket-confirm'; confirm.textContent = '确认创建';
        let submitted = false, pending = false;
        cancel.addEventListener('click', () => { if (!pending) dialog.close(); });
        dialog.addEventListener('cancel', event => { if (pending) event.preventDefault(); });
        dialog.addEventListener('close', () => { if (!submitted) button.disabled = false; dialog.remove(); });
        confirm.addEventListener('click', async () => {
          if (pending) return;
          const text = description.value.trim();
          if (!text) { error.textContent = '请填写问题描述'; return; }
          pending = true; confirm.disabled = cancel.disabled = true;
          try {
            const response = await fetch('/api/chat/actions/ticket', { method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ user_id: userId, conversation_id: cid, offer_id: offer.offer_id, description: text, ticket_type: select.value }) });
            const data = await response.json();
            if (!response.ok) throw new Error(data.detail || '创建失败，请重试');
            submitted = true; button.textContent = '工单已创建';
            const note = document.createElement('span'); note.className = 'action-note'; note.textContent = '工单号：' + data.ticket_no;
            bar.appendChild(note); dialog.close();
          } catch (err) { error.textContent = err.message; }
          finally { pending = false; confirm.disabled = cancel.disabled = false; }
        });
        dialog.append(title, label, typeLabel, error, cancel, confirm);
        document.body.appendChild(dialog); dialog.showModal(); description.focus();
      });
      bar.appendChild(button);
      if (offer.ticket_no || offer.application_no) {
        const note = document.createElement('span'); note.className = 'action-note';
        note.textContent = offer.ticket_no ? '工单号：' + offer.ticket_no : '申请号：' + offer.application_no;
        bar.appendChild(note);
      }
    }
    if (bar.children.length) bubble.appendChild(bar);
  }

  function showRefundForm(button, bar, offer, cid) {
    button.disabled = true;
    const dialog = document.createElement('dialog'); dialog.className = 'ticket-dialog';
    const title = document.createElement('h3'); title.textContent = '确认演示退款申请';
    const note = document.createElement('p'); note.textContent = '订单 ' + (offer.defaults?.order_id || '') + ' · 只保存申请，不执行实际退款。';
    const label = document.createElement('label'); label.textContent = '退款原因';
    const reason = document.createElement('select');
    for (const value of ['不喜欢/不需要', '商品质量问题', '商品与描述不符', '错发/漏发', '其他']) {
      const option = document.createElement('option'); option.value = option.textContent = value; reason.appendChild(option);
    }
    label.appendChild(reason);
    const error = document.createElement('p'); error.setAttribute('role', 'alert');
    const cancel = document.createElement('button'); cancel.type = 'button'; cancel.textContent = '取消';
    const submit = document.createElement('button'); submit.type = 'button'; submit.className = 'ticket-confirm'; submit.textContent = '确认提交';
    let pending = false, submitted = false;
    cancel.addEventListener('click', () => { if (!pending) dialog.close(); });
    dialog.addEventListener('cancel', event => { if (pending) event.preventDefault(); });
    dialog.addEventListener('close', () => { if (!submitted) button.disabled = false; dialog.remove(); });
    submit.addEventListener('click', async () => {
      if (pending) return;
      pending = true; submit.disabled = cancel.disabled = reason.disabled = true;
      try {
        const response = await fetch('/api/chat/actions/refund', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId, conversation_id: cid, offer_id: offer.offer_id, reason: reason.value }) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || '提交失败，请重试');
        submitted = true; button.textContent = '演示申请已提交';
        const receipt = document.createElement('span'); receipt.className = 'action-note'; receipt.textContent = '申请号：' + data.application_no;
        bar.appendChild(receipt); dialog.close();
      } catch (err) { error.textContent = err.message; }
      finally { pending = false; submit.disabled = cancel.disabled = reason.disabled = false; }
    });
    dialog.append(title, note, label, error, cancel, submit); document.body.appendChild(dialog); dialog.showModal(); reason.focus();
  }

  let pendingOrderCard = null;
  function invalidateOrderCard() {
    if (!pendingOrderCard) return;
    for (const button of pendingOrderCard.element.querySelectorAll('button')) button.disabled = true;
    pendingOrderCard.note.textContent = '这组选单已结束，可继续发送问题。';
    pendingOrderCard = null;
  }
  function addOrderSelection(bubble, selection) {
    if (pendingOrderCard?.selection.selection_id === selection.selection_id) return;
    invalidateOrderCard();
    const cards = document.createElement('div'); cards.className = 'order-cards';
    const note = document.createElement('small'); note.textContent = '请选择要处理的订单（演示数据），也可以直接继续聊天。'; cards.appendChild(note);
    for (const order of selection.options || []) {
      const button = document.createElement('button'); button.type = 'button'; button.className = 'order-card';
      const title = document.createElement('strong'); title.textContent = '订单 ' + order.order_id + ' · ' + (order.product_name || '商品');
      const details = document.createElement('small'); details.textContent = (order.status || '') + ' · ¥' + order.amount;
      button.append(title, details);
      button.addEventListener('click', async () => {
        if (sendBtn.disabled || button.disabled || pendingOrderCard?.selection.selection_id !== selection.selection_id) return;
        for (const item of cards.querySelectorAll('button')) item.disabled = true;
        addBubble('user', '选择订单 ' + order.order_id);
        await runChat('/api/chat/selection', { user_id: userId, conversation_id: selection.conversation_id,
          turn_id: selection.turn_id, selection_id: selection.selection_id, order_id: order.order_id });
        await recoverOrderSelection();
      });
      cards.appendChild(button);
    }
    bubble.appendChild(cards); pendingOrderCard = { element: cards, note, selection }; scrollToBottom();
  }
  async function recoverOrderSelection() {
    if (!conversationId) return;
    const requestedId = conversationId;
    try {
      const response = await fetch(`/api/chat/${conversationId}/pending?user_id=${encodeURIComponent(userId)}`);
      if (!response.ok) return;
      const data = await response.json();
      if (requestedId !== conversationId) return;
      if (!data.pending) { invalidateOrderCard(); return; }
      if (pendingOrderCard?.selection.selection_id === data.pending.selection_id) {
        for (const button of pendingOrderCard.element.querySelectorAll('button')) button.disabled = false;
        return;
      }
      const { bubble } = addBubble('assistant', '请选择需要处理的订单。'); addOrderSelection(bubble, data.pending);
    } catch (_) { /* 刷新恢复失败时仍可正常发送新消息。 */ }
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text || sendBtn.disabled) return;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    addBubble('user', text);
    await runChat('/api/chat', { user_id: userId, conversation_id: conversationId, message: text });
  }

  async function runChat(url, payload) {
    const { bubble, body, trace } = addBubble('assistant', '');
    const typing = showTyping(body);
    setSending(true);

    let content = '';
    let failed = false;
    let completed = false;
    let waiting = false;
    let savedMessageId = null;
    const citations = new Map();
    const toolBadges = new Map();
    try {
      const resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status);
      invalidateOrderCard();

      const reader = resp.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buffer = '';
      let finished = false;

      while (!finished) {
        const { value, done } = await reader.read();
        buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
        const frames = buffer.split('\n\n');
        buffer = frames.pop(); // 留最后一段不完整帧
        for (const frame of frames) {
          const res = parseFrame(frame);
          if (res.type === 'delta') {
            content += res.delta;
            renderAnswer(body, content, citations);
            scrollToBottom();
          } else if (res.type === 'citations') {
            if (Array.isArray(res.citations)) for (const item of res.citations) {
              const n = Number(item?.n);
              const chunkId = Number(item?.chunk_id);
              if (Number.isSafeInteger(n) && n > 0 && Number.isSafeInteger(chunkId) && chunkId > 0) {
                citations.set(n, { ...item, n, chunk_id: chunkId });
              }
            }
            renderAnswer(body, content, citations);
          } else if (res.type === 'conversation') {
            const id = Number(res.conversationId);
            if (Number.isSafeInteger(id) && id > 0) {
              conversationId = id;
              localStorage.setItem('mewhelp_conversation_id', String(id));
            }
          } else if (res.type === 'tool_status') {
            const name = res.tool_name || res.tool || res.name || '工具';
            const phase = res.phase || res.status || '执行中';
            trace.className = 'tool-trace visible ' +
              (phase === '成功' || phase === 'success' ? 'success' :
               phase === '失败' || phase === 'failed' || phase === 'error' ? 'failed' : 'running');
            const key = res.tool_call_id || name;
            let badge = toolBadges.get(key);
            if (!badge) {
              badge = document.createElement('span');
              badge.style.marginRight = '8px';
              toolBadges.set(key, badge);
            }
            badge.textContent = name + ' · ' + (res.message || phase);
            trace.replaceChildren(...toolBadges.values());
            scrollToBottom();
          } else if (res.type === 'actions') {
            if (Array.isArray(res.actions)) addActions(bubble, res.actions, res.conversation_id);
          } else if (res.type === 'order_selection') {
            waiting = true;
            body.textContent = '请选择需要处理的订单。';
            addOrderSelection(bubble, res);
          } else if (res.type === 'workflow_status') {
            if (!trace.textContent) {
              trace.className = 'tool-trace visible running';
              trace.textContent = '正在处理您的问题…';
            }
          } else if (res.type === 'workflow_summary') {
            savedMessageId = res.message_id;
          } else if (res.type === 'error') {
            throw new Error(res.message);
          } else if (res.type === 'done') {
            completed = true;
            finished = true;
          }
        }
        if (done) finished = true; // 流结束兜底
      }
    } catch (err) {
      failed = true;
      body.textContent = '（小喵走神了：' + err.message + '）';
    } finally {
      if (typing.parentNode) typing.remove();
      if (toolBadges.size === 0) {
        trace.textContent = '';
        trace.className = 'tool-trace';
      } else {
        trace.classList.remove('running');
      }
      if (!content && !failed && !waiting) body.textContent = '（未收到回复）';
      if (content && !failed) renderAnswer(body, content, citations);
      if (completed && content.trim() && !failed) addFeedback(bubble, savedMessageId ? `${conversationId}:${savedMessageId}` : null);
      setSending(false);
      refreshSidebar();
      scrollToBottom();
    }
  }

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  sendBtn.addEventListener('click', send);

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  addBubble('assistant', '你好呀～我是喵喵优选的智能客服「小喵」，商品、订单、物流、售后问题都可以问我 🐾');
  function applyConversationView(id, data) {
    invalidateOrderCard();
    messagesEl.replaceChildren();
    conversationId = id;
    localStorage.setItem('mewhelp_conversation_id', String(id));
    for (const row of data.messages || []) {
      if (!['user','assistant'].includes(row.role) || !row.content) continue;
      const { bubble, body } = addBubble(row.role, row.content);
      if (row.role === 'assistant') {
        const citations = new Map((row.citations || []).map(item => [Number(item.n), item]));
        renderAnswer(body, row.content, citations);
        addFeedback(bubble, `${id}:${row.id}`);
        addActions(bubble, row.actions || [], id);
      }
    }
    for (const button of document.querySelectorAll('.conversation-item')) button.classList.toggle('active', Number(button.dataset.conversationId) === id);
    recoverOrderSelection();
  }
  async function switchConversation(id) {
    if (isStreaming) return;
    const requestId = ++switchRequestId;
    try {
      const response = await fetch(`/api/conversations/${id}/messages?user_id=${encodeURIComponent(userId)}`);
      if (!response.ok) return;
      const data = await response.json();
      if (requestId !== switchRequestId || isStreaming) return;
      applyConversationView(id, data);
    } catch (_) { /* 保留当前会话，失败不影响发送。 */ }
  }
  async function refreshSidebar() {
    const requestId = ++sidebarRequestId;
    const items = []; let cursor = null;
    try {
      do {
        const params = new URLSearchParams({user_id:userId,limit:'100'});
        if (cursor) params.set('cursor',cursor);
        const response = await fetch('/api/conversations?' + params);
        if (!response.ok) return;
        const page = await response.json();
        items.push(...page.items); cursor = page.next_cursor;
      } while (cursor);
      if (requestId !== sidebarRequestId) return;
      const buttons = items.map(item => {
        const button = document.createElement('button'); button.type = 'button';
        button.className = 'conversation-item'; button.dataset.conversationId = item.id;
        button.textContent = item.first_question || '新对话'; button.disabled = isStreaming;
        button.classList.toggle('active', item.id === conversationId);
        if (item.has_summary) { const mark = document.createElement('small'); mark.textContent = '已摘要'; button.append(mark); }
        button.addEventListener('click', () => switchConversation(item.id)); return button;
      });
      document.getElementById('conversation-list').replaceChildren(...buttons);
    } catch (_) { /* 侧栏静默降级。 */ }
  }
  document.getElementById('new-conversation').addEventListener('click', () => {
    if (isStreaming) return;
    switchRequestId++; invalidateOrderCard();
    conversationId = null; localStorage.removeItem('mewhelp_conversation_id');
    messagesEl.replaceChildren();
    addBubble('assistant','新对话已准备好，商品、订单、物流和售后问题都可以问我。');
    for (const button of document.querySelectorAll('.conversation-item')) button.classList.remove('active');
    inputEl.focus();
  });
  refreshSidebar();
  if (conversationId) switchConversation(conversationId);
</script>
</body>
</html>
